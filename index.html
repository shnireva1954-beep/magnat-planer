<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Магнат</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Магнат">
<meta name="theme-color" content="#080b11">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%8F%9B%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#080b11; --bg2:#0b0f17; --panel:#0f1520; --panel2:#131b28;
    --line:#1c2735; --line2:#26374b;
    --emerald:#2fe38f; --cyan:#35d0ff; --gold:#f5c451; --violet:#b06bff; --danger:#ff6b6b; --orange:#ff9f43;
    --ink:#eef4fb; --mut:#93a6bd; --mut2:#68809b;
    --fd:Georgia,"Times New Roman",serif; --fb:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color-scheme:dark;   /* тёмные выпадающие списки и поля: дизайн один, тёмный */
  }
  *{box-sizing:border-box; margin:0; padding:0}
  ::selection{background:#2fe38f3d; color:var(--ink);}
  :focus-visible{outline:2px solid var(--emerald); outline-offset:2px; border-radius:4px;}
  body{background:radial-gradient(1100px 620px at 82% -6%,#123044 0%,transparent 55%),radial-gradient(800px 560px at 6% 3%,#0f2a20 0%,transparent 55%),linear-gradient(180deg,var(--bg2),var(--bg));
    color:var(--ink); font-family:var(--fb); line-height:1.45; -webkit-font-smoothing:antialiased; min-height:100vh;
    padding-bottom:calc(80px + env(safe-area-inset-bottom));}
  /* вырез и скруглённые углы телефона не должны срезать содержимое */
  .wrap{max-width:1120px; margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left)); padding-right:max(16px,env(safe-area-inset-right));}
  .glass{background:linear-gradient(168deg,rgba(20,28,42,.62),rgba(15,21,32,.62)); backdrop-filter:blur(11px) saturate(1.15); -webkit-backdrop-filter:blur(11px) saturate(1.15); border:1px solid var(--line2); border-radius:16px; box-shadow:inset 0 1px 0 #ffffff0e,0 8px 26px #00000038;}
  .card{padding:15px 15px;} .card>h3{font-size:11px; letter-spacing:1.1px; text-transform:uppercase; color:var(--mut2); font-weight:600; margin-bottom:11px; display:flex; justify-content:space-between; align-items:center;}
  canvas{display:block; width:100%; height:auto;}
  /* min(...) обязателен: голый minmax(250px,…) шире узкого контейнера при зуме и даёт скролл */
  .grid{display:grid; gap:13px; grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));}
  .num{font-variant-numeric:tabular-nums;}

  /* top bar */
  /* standalone-режим с black-translucent кладёт статус-бар поверх страницы:
     без этого отступа время и LTE налезали на название и кошелёк */
  header{position:sticky; top:0; z-index:20; background:#080b11d9; backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);}
  .bar{display:flex; align-items:center; gap:12px; height:60px;}
  .brand{display:flex; align-items:center; gap:9px; margin-right:auto;}
  .brand .c{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:linear-gradient(150deg,#0e3327,#0a1a24);border:1px solid var(--line2);box-shadow:0 0 14px #2fe38f22;}
  .brand b{font-family:var(--fd); font-size:20px;}
  .chip{display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; font-size:14px; font-weight:700; font-variant-numeric:tabular-nums;}
  .chip.coin{background:linear-gradient(180deg,#1d1707,#120d04); border:1px solid #6e5320; color:var(--gold);}
  .chip.lvl{background:#0e2f22; border:1px solid #1c7a54; color:var(--emerald); font-family:var(--fd); cursor:pointer;}
  /* номер уровня виден всегда, звание — только когда есть место */
  @media(max-width:520px){ .chip.lvl .rk{display:none} }
  /* на самых узких (280 px) шапка не вмещает и номер — уровень всё равно крупно на Обзоре */
  @media(max-width:340px){ .chip.lvl{display:none} }

  /* tabs */
  /* край гасим только с той стороны, где вкладки реально продолжаются:
     постоянная маска обрезала последнюю вкладку даже в самом конце полосы */
  .tabs{display:flex; gap:8px; overflow-x:auto; padding:11px 1px 3px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .tabs.fl{mask-image:linear-gradient(90deg,transparent,#000 34px); -webkit-mask-image:linear-gradient(90deg,transparent,#000 34px);}
  .tabs.fr{mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent); -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 34px),transparent);}
  .tabs.fl.fr{mask-image:linear-gradient(90deg,transparent,#000 34px,#000 calc(100% - 34px),transparent); -webkit-mask-image:linear-gradient(90deg,transparent,#000 34px,#000 calc(100% - 34px),transparent);}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none; padding:8px 13px; border-radius:11px; font-size:13px; color:var(--mut); background:var(--panel); border:1px solid var(--line); cursor:pointer; white-space:nowrap; transition:all .15s;}
  .tab.on{color:#04120b; background:var(--emerald); border-color:var(--emerald); font-weight:700; box-shadow:0 0 16px #2fe38f44;}

  .view{padding:15px 0 30px; display:none;} .view.on{display:block;}
  .row2{display:grid; gap:13px; grid-template-columns:1fr 1fr;} @media(max-width:560px){.row2{grid-template-columns:1fr}}
  /* без этого длинное название в flex:1 раздвигает карточку и рождает
     горизонтальный скролл всей страницы на узких экранах (320px) */
  .grid>*, .row2>*{min-width:0;}
  .prow .nm, .q .nm, .frow .cat{min-width:0;}

  /* hero */
  .hero{padding:18px;} .hero-row{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .lvl-tag{font-size:11px; color:var(--emerald); letter-spacing:1.4px; text-transform:uppercase;}
  .lvl-name{font-family:var(--fd); font-size:26px; margin-top:3px;} .building{font-size:44px; filter:drop-shadow(0 0 10px #2fe38f55);}
  .lvl-rank{font-size:13px; color:var(--mut); margin-top:3px;}
  .lvl-next{font-size:11.5px; color:var(--mut2); margin-top:9px; line-height:1.5;} .lvl-next b{color:var(--gold); font-weight:600;}
  .bar-t{height:11px; border-radius:99px; background:#0a1119; border:1px solid var(--line); overflow:hidden; margin-top:15px;}
  .bar-t span{display:block; height:100%; background:linear-gradient(90deg,#178a5a,var(--emerald)); box-shadow:0 0 13px #2fe38f88;}
  .bar-m{display:flex; justify-content:space-between; font-size:12px; color:var(--mut); margin-top:7px;} .bar-m b{color:var(--ink)}
  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:12px;}
  .tile{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 6px; text-align:center;}
  .tile .v{font-size:19px; font-weight:700; line-height:1;} .tile .l{font-size:9.5px; color:var(--mut2); text-transform:uppercase; letter-spacing:.6px; margin-top:5px;}
  .g{color:var(--gold)} .e{color:var(--emerald)} .cy{color:var(--cyan)} .vi{color:var(--violet)} .dn{color:var(--danger)} .or{color:var(--orange)}

  .stat .v{font-size:26px; font-weight:700; font-family:var(--fd); line-height:1;} .stat .l{font-size:12px; color:var(--mut); margin-top:5px;}
  .donut-wrap{position:relative; display:flex; justify-content:center;} .donut-c{position:absolute; text-align:center; top:50%; transform:translateY(-50%);}
  .donut-c .p{font-size:24px; font-weight:700; font-family:var(--fd);} .donut-c .t{font-size:10px; color:var(--mut2); text-transform:uppercase;}

  /* календарь привычек — настоящий месяц: 7 столбцов, дни недели, весь месяц на экране.
     До 29.09.2026 была таблица «привычки × 31 день» с прокруткой вбок: на телефоне
     видно 5–6 чисел без месяца и дней недели — Артём: «непонятно даже, что это календарь» */
  .calhd{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .calt{font-family:var(--fd); font-size:21px; color:var(--ink);} .calt span{color:var(--mut2); font-size:17px; margin-left:3px;}
  .calnav{width:40px; height:40px; flex:none; border-radius:12px; background:var(--panel); border:1px solid var(--line2); color:var(--ink); font-size:20px; line-height:1; cursor:pointer;}
  .calnav:disabled{opacity:.28; cursor:default;}
  .calf{display:flex; gap:7px; overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; margin-bottom:13px; padding-bottom:1px;}
  .calf::-webkit-scrollbar{display:none}
  /* как у вкладок: край гаснет только там, где чипы продолжаются */
  .calf.fl{mask-image:linear-gradient(90deg,transparent,#000 28px); -webkit-mask-image:linear-gradient(90deg,transparent,#000 28px);}
  .calf.fr{mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent); -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);}
  .calf.fl.fr{mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent); -webkit-mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent);}
  .fchip{flex:none; padding:7px 13px; border-radius:99px; font-size:12.5px; background:var(--panel); border:1px solid var(--line2); color:var(--mut); cursor:pointer; white-space:nowrap; user-select:none;}
  .fchip.on{background:#0e2f22; border-color:#2fa872; color:#e9fff6; font-weight:600;}
  .fchip .hn{max-width:170px; vertical-align:top;}
  .calg{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px;}
  .calwd{text-align:center; font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:#8196b0; padding-bottom:3px;}
  .calwd.we{color:#c9a55a;}
  .cd{position:relative; aspect-ratio:1; min-height:32px; border-radius:11px; display:grid; place-items:center; background:var(--panel); border:1px solid var(--line); color:#b4c3d6; font-size:13.5px; font-weight:600; font-variant-numeric:tabular-nums; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;}
  .cd>span{position:relative; z-index:1;}
  /* сегодня: точка под числом — как в календаре телефона; у одной привычки ещё и рамка */
  .cd.tdy>span::after{content:""; position:absolute; left:50%; bottom:-6px; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:currentColor;}
  .cd.tdy{color:var(--emerald);}
  .hcell.tdy{border:2px solid var(--emerald); box-shadow:0 0 12px #2fe38f33;}
  .cd.fut{background:transparent; border-style:dashed; color:var(--mut2); opacity:.45; cursor:default;}
  .cd.pre{opacity:.45;}   /* привычки тогда ещё не было — но отметить задним числом можно */
  .hcell.on, .cday.full{background:linear-gradient(155deg,#3cf0a0,#1db872); border-color:transparent; color:#04120b; font-weight:800; box-shadow:0 0 14px #2fe38f40;}
  .hcell.on::after{content:"✓"; position:absolute; top:2px; right:5px; font-size:9px; font-weight:900; color:#04120b;}
  /* «Все»: кольцо по краю дня — какая доля привычек отмечена */
  .cday:not(.fut):not(.full)::before{content:""; position:absolute; inset:-1px; border-radius:inherit; padding:2.5px;
    background:conic-gradient(var(--emerald) calc(var(--p,0)*360deg),#ffffff12 0);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);}
  .calleg{display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; margin-top:13px; font-size:11px; color:var(--mut2);}
  .calleg i{display:inline-block; width:12px; height:12px; border-radius:4px; vertical-align:-2px; margin-right:5px;}
  .calleg .lr{border:2px solid #2fa872;} .calleg .lf{background:var(--emerald);}
  .calfoot{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:13px; font-size:12.5px; color:var(--mut);}
  .calfoot b{color:var(--emerald);}
  /* длинное название в чипе обрезается многоточием */
  .hn{display:inline-block; vertical-align:bottom; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:230px;}
  .prow{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid var(--line);}
  .prow:last-child{border:none} .prow .nm{flex:1; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ptrack{width:90px; height:8px; border-radius:99px; background:#0a1119; border:1px solid var(--line); overflow:hidden; flex:none;}
  .pfill{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#7a3ecf,var(--violet)); box-shadow:0 0 7px #b06bff66;}
  .prow .pc{font-size:12px; color:var(--violet); width:38px; text-align:right; font-variant-numeric:tabular-nums;}

  /* quests / lists */
  .q{display:flex; align-items:center; gap:7px; padding:12px 13px; border-radius:11px; background:var(--panel); border:1px solid var(--line); cursor:pointer; margin-bottom:8px; transition:all .15s;}
  .q .box{width:22px;height:22px;margin-right:4px;border-radius:6px;border:2px solid var(--line2);flex:none;display:grid;place-items:center;color:#04120b;font-weight:900;font-size:13px;}
  .q.done{background:linear-gradient(90deg,#0e2f22,var(--panel)); border-color:#1c7a54;} .q.done .box{background:var(--emerald);border-color:var(--emerald);}
  .q .nm{flex:1; font-size:14px;} .q.done .nm{color:#e9fff6} .q .cn{color:var(--gold); font-size:12.5px; font-variant-numeric:tabular-nums;}
  .q .meta{font-size:11px; color:var(--mut2);}
  .tag{font-size:10px; padding:2px 8px; border-radius:99px; font-weight:700;}
  .tag.hi{background:#3a1620;color:#ff8fa3;border:1px solid #7a2b3d} .tag.md{background:#2a2410;color:var(--gold);border:1px solid #6e5320} .tag.lo{background:#12243a;color:var(--cyan);border:1px solid #234b6e}
  /* кнопки «Добавить …» — заметные и одинаковые на всех экранах. У серой пунктирной рамки
     был контраст 1,46 при норме 3 (WCAG 1.4.11): Артём 29.09 — «плохо видно». Здесь 5,9 */
  .addbtn{display:flex; align-items:center; justify-content:center; gap:10px; width:100%; min-height:50px; padding:12px 14px; border-radius:13px; background:linear-gradient(180deg,#0f271e,#0c1f18); border:1.5px solid #2fa872; color:var(--emerald); font-size:14.5px; font-weight:700; cursor:pointer; margin-top:4px; user-select:none;}
  .addbtn .pl{width:24px; height:24px; flex:none; border-radius:50%; background:var(--emerald); color:#04120b; display:grid; place-items:center; font-size:18px; font-weight:900; line-height:1; box-shadow:0 0 10px #2fe38f55;}
  @media(hover:hover){ .addbtn:hover{background:linear-gradient(180deg,#12332a,#0e271e);} }
  /* цели для пальца: 21×22 приводили к промахам и потере данных одним касанием */
  .del{color:var(--danger); font-size:16px; cursor:pointer; min-width:40px; height:40px; display:inline-flex; align-items:center; justify-content:center; flex:none; margin:-9px 0;}

  /* finance rows */
  .frow{display:flex; align-items:center; gap:6px; padding:10px 2px; border-bottom:1px solid var(--line); font-size:13.5px;}
  .frow:last-child{border:none} .frow .cat{flex:1} .frow .amt{font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap; margin-left:auto;}
  .frow .fdt{font-size:10.5px; color:var(--mut2); font-variant-numeric:tabular-nums;}
  .hedit2{color:var(--emerald); font-size:10.5px; cursor:pointer; text-transform:none; letter-spacing:0; font-weight:600;}
  .si .cnt{font-size:9.5px; color:var(--emerald); margin-top:4px;}
  .si .cnt.hintc{color:var(--mut2);}
  .si .rm{font-size:14px; line-height:1;}
  /* пояснение под автоматически посчитанной нормой */
  .nrm{font-size:10.5px; color:var(--mut2); margin-top:9px; line-height:1.5;}
  .nprof{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:12.5px; color:var(--mut); padding:13px 15px;}
  .nprof>span:first-child{min-width:0;}
  .modal input[type=date]{color-scheme:dark;}

  /* reward shop */
  .shop{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(120px,100%),1fr)); gap:10px;}
  .si{background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:14px 8px; text-align:center; cursor:pointer; transition:all .18s; position:relative;}
  .si .i{font-size:26px} .si .n{font-size:11.5px; color:var(--mut); margin:8px 0 6px; min-height:30px; display:flex; align-items:center; justify-content:center;}
  .si .pr{font-size:13px; color:#8a6f2e; font-weight:700; font-variant-numeric:tabular-nums;}
  .si.afford{border-color:#1c7a54; box-shadow:0 0 14px #2fe38f22;} .si.afford .pr{color:var(--emerald)}

  .sec-h{font-size:15px; margin:22px 2px 12px;}
  .ins-t b{color:var(--gold);}
  /* заметка про демо-данные */
  .demonote{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:13px; font-size:12.5px; color:var(--mut); padding:12px 14px;}
  .demonote .ok2{padding:8px 12px; border-radius:10px; border:none; background:linear-gradient(180deg,var(--emerald),#17a768); color:#04120b; font-weight:700; font-size:12px; cursor:pointer; white-space:nowrap;}
  /* кликабельные сводки на Обзоре */
  .card[data-go]{cursor:pointer;}
  .card .go{color:var(--mut2); font-size:14px; font-weight:400;}
  /* редактирование задачи и своя награда */
  .ted{color:var(--mut2); font-size:15px; cursor:pointer; min-width:38px; height:40px; display:inline-flex; align-items:center; justify-content:center; flex:none; margin:-9px 0;}
  .si .rm{position:absolute; top:0; right:0; color:var(--mut2); cursor:pointer; width:40px; height:40px; display:grid; place-items:center;}
  /* аккуратная форма добавления (вместо системных prompt) */
  .ovl{position:fixed; inset:0; background:#000b; backdrop-filter:blur(4px); display:flex; justify-content:center; z-index:50; padding:20px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  /* margin:auto центрирует, пока форма влезает, и позволяет прокрутить, когда нет
     (низкий экран с открытой клавиатурой — кнопка «Готово» уезжала за край) */
  .modal{margin:auto; width:100%; max-width:360px; background:linear-gradient(168deg,#16223a,#0f1520); border:1px solid var(--line2); border-radius:20px; padding:22px; box-shadow:0 20px 60px #000a;}
  .modal h4{font-size:18px; margin-bottom:6px; font-family:var(--fd);}
  .modal .lab{font-size:12px; color:var(--mut2); text-transform:uppercase; letter-spacing:.6px; display:block; margin:14px 0 6px;}
  .modal input, .modal select{width:100%; padding:13px 13px; border-radius:12px; background:var(--panel); border:1px solid var(--line2); color:var(--ink); font-size:16px; outline:none;}
  .modal input:focus, .modal select:focus{border-color:var(--emerald);}
  .modal .ferr{display:none; margin-top:14px; font-size:12.5px; color:var(--danger); line-height:1.45;}
  .modal .ferr.on{display:block;}
  .modal .btns{display:flex; gap:10px; margin-top:20px;}
  .modal .btns button{flex:1; padding:13px; border-radius:12px; border:none; font-size:15px; font-weight:700; cursor:pointer;}
  .modal .ok{background:linear-gradient(180deg,var(--emerald),#17a768); color:#04120b; box-shadow:0 0 18px #2fe38f44;}
  .modal .no{background:var(--panel); color:var(--mut); border:1px solid var(--line2);}
  /* сетка категорий в форме финансов (как Monarch/Copilot) */
  .amt-in{font-size:30px !important; text-align:center; font-family:var(--fd); font-variant-numeric:tabular-nums;}
  .catgrid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-top:6px;}
  .catopt{padding:11px 4px; border-radius:12px; background:var(--panel); border:1px solid var(--line); text-align:center; cursor:pointer; font-size:10.5px; color:var(--mut); transition:all .15s;}
  .catopt:active{transform:scale(.95)}
  .catopt .ci{font-size:23px; display:block; margin-bottom:4px;}
  .catopt.sel{border-color:var(--emerald); background:#0e2f22; color:#e9fff6; box-shadow:0 0 12px #2fe38f33;}

<script>
"use strict";
/* при обновлении страницы открывать сверху, а не с прошлой позиции скролла */
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
const KEY="magnat_app_v2", DAYOK=3;
// Уровни империи: номер растёт часто (первые — за пару дней), звание меняется реже.
// Опыт до уровня L: 20·k·(2k+3), где k=L−1 → 2-й 100 ⭐, 5-й 880, 10-й 3 780, 20-й 15 580.
// Пороги званий подобраны так, чтобы при переходе со старых пяти ступеней
// (0/300/1500/5000/15000 ⭐) никто не потерял звание: каждое наступает не позже прежнего.
const RANKS=[["🐣","Новичок",1,"🛖"],["🚀","Стартапер",3,"🏠"],["💼","Предприниматель",6,"🏢"],["🏢","Директор",11,"🏙"],["👑","Магнат",19,"👑"]];
const xpForLevel=L=>{const k=Math.max(0,L-1);return 20*k*(2*k+3);};
function levelOf(xp){
  let k=Math.floor((-60+Math.sqrt(3600+160*Math.max(0,xp)))/80);
  while(k>0 && 20*k*(2*k+3)>xp) k--;                 // страховка от округления
  while(20*(k+1)*(2*(k+1)+3)<=xp) k++;
  return k+1;
}
const rankOf=L=>{let r=0;RANKS.forEach((x,i)=>{if(L>=x[2])r=i;});return r;};
const rankName=r=>RANKS[r][0]+" "+RANKS[r][1];
// Все привычки стоят одинаково: цену не назначает пользователь.
// Разницу создаёт не ценник, а серия — множитель до ×2.
const COIN=20;
const TASKCOIN=20;    // выполненная задача — как отмеченная привычка
const LVLBONUS=50;    // подарок в кошелёк за каждый новый уровень (опыта не добавляет)
const DEFHABITS=[["🏋️","Тренировка"],["📚","Час на дело / обучение"],["💰","Шаг к деньгам"],["📵","День без залипания"],["🧊","Холодный душ"],["💧","Вода 2 л"],["🚶","10 000 шагов"],["✍️","Разбор дня"]];
// С чего начать — выбирает сам владелец; отмечены три (решение Артёма 29.09.2026).
// Раньше чистый лист сразу давал восемь привычек: каждый день начинался с «0 из 8»,
// и даже хороший день выглядел как «3 из 8». Для серии хватает трёх отметок (DAYOK).
const HABITPICK=[["🏋️","Тренировка",1],["📵","Лента не больше 30 минут",1],["💼","Шаг к работе",1],
  ["📚","Час на дело / обучение"],["💰","Шаг к деньгам"],["🧊","Холодный душ"],["💧","Вода 2 л"],["🚶","10 000 шагов"],["✍️","Разбор дня"]];
// Цена награды — в ПРИВЫЧКАХ: «Читмил = 5 привычек» понятно с первого взгляда.
// Раньше цена считалась от среднего заработка за две недели и выглядела случайным числом.
const SIZES=[[5,"Мелкая — 5 привычек"],[15,"Средняя — 15 привычек"],[40,"Крупная — 40 привычек"],[150,"Мечта — 150 привычек"]];
const pl=(n,one,few,many)=>{const a=n%10,b=n%100;return (a===1&&b!==11)?one:(a>=2&&a<=4&&(b<12||b>14))?few:many;};
const plH=n=>pl(n,"привычка","привычки","привычек");
const rwCost=r=>r.n*COIN;
// Главные награды — привычные удовольствия на каждый день, крупные — редкие
const DEFREWARDS=[["📱","30 минут TikTok",5],["🎮","Час игр",5],["🍔","Читмил",5],["🎬","Вечер кино",15],["🛍","Новая вещь",40],["🌴","Поездка",150]];
const RV=2;           // версия набора наград: 2 — цены в привычках, без «Выходного», с TikTok
const TABS=[["home","🏛 Обзор"],["habits","✅ Привычки"],["tasks","🎯 Задачи"],["money","💰 Финансы"],["body","💪 Тело"],["shop","🛒 Награды"]];
const nf=n=>Math.round(n).toLocaleString("ru-RU");
// в суммах — настоящий минус «−», а не дефис: с дефисом «-300» слипается с соседним значком
const sgn=n=>(n<0?"−":"")+nf(Math.abs(n));
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const gv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const pad=x=>String(x).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[y,m,dd]=s.split("-").map(Number);return new Date(y,m-1,dd);};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d);};
const fmtD=s=>s.slice(8,10)+"."+s.slice(5,7);
const isYmd=s=>typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s);
// дата живая: приложение может остаться открытым на телефоне через полночь
let TODAY=ymd(new Date());
let CURMONTH=TODAY.slice(0,7);
function refreshToday(){ const t=ymd(new Date()); if(t===TODAY) return false; TODAY=t; CURMONTH=t.slice(0,7); return true; }
// уникальные id, которые не столкнутся при добавлении двух записей в одну миллисекунду
let uidN=0; const uid=()=>Date.now()*1000+(uidN=(uidN+1)%1000);
// «82,4», «2 400», «1 500 ₽» — всё это должно превращаться в число, а не в 0
const num=v=>{ if(typeof v==="number") return Number.isFinite(v)?v:0;
  const n=parseFloat(String(v??"").replace(/[\s  ]/g,"").replace(",","."));
  return Number.isFinite(n)?n:0; };

// ---- эмодзи в названии и цена награды ----
// Иконка — эмодзи в начале названия. Стёр его — значит иконки нет, и она не возвращается.
const RE_ICO=/^((?:\p{Extended_Pictographic}\uFE0F?(?:[\u{1F3FB}-\u{1F3FF}])?)(?:\u200D\p{Extended_Pictographic}\uFE0F?)*)\s*([\s\S]*)$/u;
function parseIco(v){
  const t=String(v==null?"":v).trim(), m=t.match(RE_ICO);
  if(m && m[2].trim()) return {ico:m[1], name:m[2].trim()};
  return {ico:"", name:t};      // без эмодзи впереди — всё название целиком
}
const withIco=(ico,name)=>(ico?ico+" ":"")+name;

const nearestSize=n=>SIZES.reduce((a,b)=>Math.abs(b[0]-n)<Math.abs(a-n)?b[0]:a,SIZES[0][0]);
// старые размеры были в днях дисциплины: день → мелкая, три дня → средняя, неделя → крупная, месяц → мечта
const OLDDAYS={1:5,3:15,7:40,30:150};
function defRewards(){
  let id=1;
  return DEFREWARDS.map(([ico,name,n])=>({id:id++,ico,name,n}));
}

let FIRST_RUN=false;
function load(){
  try{const r=localStorage.getItem(KEY); if(r) return normalize(JSON.parse(r));}catch(e){}
  FIRST_RUN=true; return seed();
}
function save(){ invalidate();
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ toast("Не удалось сохранить — освободи место в браузере"); }  // молчать тут нельзя
}
function freshStart(){  // чистый лист — без чужих данных
  let id=1; const habits=DEFHABITS.map(([ico,name])=>({id:id++,ico,name,since:""}));
  return {habits, checks:{}, tasks:[], taskBank:0, finance:{income:0,entries:[]}, body:{goalW:0,calGoal:2400,waterGoal:2500,calManual:false,waterManual:false,sex:"",height:0,birth:0,act:"auto",log:[]}, rewards:defRewards(), rv:RV, boughtCnt:{}, spent:0};
}
// приводим любые данные (старая версия, ручная правка, чужой файл) к рабочему виду —
// иначе одно недостающее поле роняет всё приложение в белый экран
function normalize(d){
  if(!d||typeof d!=="object"||Array.isArray(d)) return freshStart();
  const def=freshStart(), o={};
  o.habits=Array.isArray(d.habits)
    ? d.habits.filter(h=>h&&typeof h==="object").map((h,i)=>({
        id:Number.isFinite(+h.id)?+h.id:i+1,
        ico:typeof h.ico==="string"?h.ico:"",       // пустая иконка — законное состояние
        name:String(h.name||"Привычка"),
        since:isYmd(h.since)?h.since:"",            // "" — привычка была всегда
        // true/false — владелец сам сказал, тренировка это или нет; нет поля — угадываем по названию
        ...(typeof h.sport==="boolean"?{sport:h.sport}:{})}))
    : def.habits;
  const ids=new Set(o.habits.map(h=>h.id));
  o.checks={};
  if(d.checks&&typeof d.checks==="object") for(const k in d.checks){
    if(!isYmd(k)||!Array.isArray(d.checks[k])) continue;
    const a=[...new Set(d.checks[k].map(Number).filter(n=>ids.has(n)))];
    if(a.length) o.checks[k]=a;
  }
  o.tasks=Array.isArray(d.tasks)?d.tasks.filter(t=>t&&typeof t==="object").map(t=>({
    id:Number.isFinite(+t.id)?+t.id:uid(), name:String(t.name||"Задача"),
    prio:["hi","md","lo"].includes(t.prio)?t.prio:"md",
    due:isYmd(t.due)?t.due:TODAY, done:!!t.done})):[];
  // монеты за выполненные задачи, которые потом убрали из списка — заработанное не сгорает
  o.taskBank=Math.max(0,Math.round(num(d.taskBank)));
  const fin=(d.finance&&typeof d.finance==="object")?d.finance:{};
  o.finance={income:Math.max(0,num(fin.income)), entries:Array.isArray(fin.entries)?fin.entries
    .filter(e=>e&&typeof e==="object").map(e=>({
      id:Number.isFinite(+e.id)?+e.id:uid(), type:e.type==="in"?"in":"out",
      cat:String(e.cat||"💸 Прочее"), amount:Math.round(Math.abs(num(e.amount))),
      date:isYmd(e.date)?e.date:TODAY})).filter(e=>e.amount>0):[]};
  const b=(d.body&&typeof d.body==="object")?d.body:{};
  const seen=new Set(); const log=(Array.isArray(b.log)?b.log:[])
    .filter(x=>x&&isYmd(x.date)&&num(x.w)>0)
    .map(x=>({date:x.date,w:Math.round(num(x.w)*10)/10}))
    .sort((p,q)=>p.date<q.date?-1:p.date>q.date?1:0)
    .filter(x=>{ if(seen.has(x.date)) return false; seen.add(x.date); return true; });
  const yNow=+TODAY.slice(0,4), hgt=Math.round(num(b.height)), byr=Math.round(num(b.birth));
  o.body={goalW:Math.max(0,num(b.goalW)), calGoal:Math.round(num(b.calGoal))||2400,
          waterGoal:Math.round(num(b.waterGoal))||2500,
          calManual:!!b.calManual, waterManual:!!b.waterManual,
          sex:b.sex==="f"?"f":b.sex==="m"?"m":"",
          height:(hgt>=100&&hgt<=250)?hgt:0,
          birth:(byr>=yNow-100&&byr<=yNow-10)?byr:0,
          act:["auto","1.2","1.375","1.55","1.725","1.9"].includes(b.act)?b.act:"auto",
          log};
  // размер награды в привычках. Новый формат — поле n; старый — дни (1/3/7/30) или голая цена
  const mkRw=(r,fallbackId)=>{
    const n=SIZES.some(x=>x[0]===+r.n)?+r.n
           :OLDDAYS[+r.days]?OLDDAYS[+r.days]
           :nearestSize(Math.max(1,num(r.cost))/COIN);
    return {id:Number.isFinite(+r.id)?+r.id:fallbackId, ico:typeof r.ico==="string"?r.ico:"🎁",
            name:String(r.name||"Награда"), n};
  };
  if(Array.isArray(d.rewards)){
    // пустой список — это выбор владельца, а не отсутствие данных: не подсовываем встроенные обратно
    o.rewards=d.rewards.filter(r=>r&&typeof r==="object").map((r,i)=>mkRw(r,i+1));
  }else{
    // самый старый формат: 6 встроенных наград + свои. Переносим в один общий список
    o.rewards=defRewards();
    if(Array.isArray(d.myRewards)) d.myRewards.filter(r=>r&&typeof r==="object")
      .forEach((r,i)=>o.rewards.push(mkRw(r,1000+i)));
  }
  o.boughtCnt={};
  const addCnt=(k,n)=>{ if(n>0) o.boughtCnt[k]=(o.boughtCnt[k]||0)+n; };
  if(d.boughtCnt&&typeof d.boughtCnt==="object") for(const k in d.boughtCnt) addCnt(k,Math.round(num(d.boughtCnt[k])));
  if(Array.isArray(d.bought)) d.bought.forEach(i=>{ const r=o.rewards[Math.round(num(i))]; if(r) addCnt(r.id,1); });
  if(d.boughtMy&&typeof d.boughtMy==="object") for(const k in d.boughtMy) addCnt(k,Math.round(num(d.boughtMy[k])));
  // Один раз при переходе на набор v2 (решение Артёма 24.09.2026): «Выходной» убираем —
  // «отдых» лишний; главная награда — привычная, вроде TikTok. Свои награды не трогаем.
  o.rv=Math.round(num(d.rv));

const dayGoal=d=>Math.max(1,Math.min(DAYOK,poolOn(d)));

function stats(){
  if(_st) return _st;

  for(const d of days){

    xp+=Math.round(checksOf(d).length*COIN*mult(before));

}

function homeInsight(){
  if(Object.keys(S.checks).length<7 || !S.habits.length) return null;
  // 1) близкий рекорд серии
  const rec=recordStreak(), st=curStreak();

    const n=rec-st+1;
    if(n<=7){ const w=n===1?"день":(n<5?"дня":"дней");
      return `Держи темп ещё <b>${n} ${w}</b> — побьёшь свой рекорд из <b>${rec} дн.</b>`; }
  }
  // 2) заметная дельта дисциплины неделя к неделе.
  // Обе недели должны быть прожиты в приложении, иначе «+600%» из одного дня против нуля.
  const a=pctRange(6,0), b=pctRange(13,7);
  if(b.used>=4 && a.used>=4 && b.pct>=0.15){
    const d=Math.round((a.pct-b.pct)/b.pct*100);
    if(d>=10) return `За неделю дисциплина выросла на <b>+${Math.min(d,300)}%</b>. Отличный разгон.`;
    if(d<=-10) return `Дисциплина просела на <b>${Math.abs(d)}%</b> за неделю — вернись в ритм сегодня.`;
  }

  // и только если каждого такого дня недели набралось хотя бы три
  const start=firstDay(), wd=[0,0,0,0,0,0,0], wt=[0,0,0,0,0,0,0], wn=[0,0,0,0,0,0,0];

  }

}

    c.beginPath(); c.arc(w/2,py,4.5,0,7); c.fillStyle=cy1; c.shadowColor=cy1; c.shadowBlur=10; c.fill(); c.shadowBlur=0;
    c.fillStyle=cy1; c.font="700 13px system-ui"; c.textAlign="center"; c.fillText(String(log[0].w)+" кг", w/2, py-12);
    c.fillStyle="#68809b"; c.font="11px system-ui";
    c.fillText("запиши вес ещё раз — появится линия", w/2, py+26);
    return;
  }
  const data=log.map(x=>x.w);
  const vals=goal?[...data,goal]:[...data];
  let mn=Math.min(...vals), mx=Math.max(...vals);
  if(mx-mn<0.8){mx+=0.5;mn-=0.5;}
  const padL=10,padR=58,padY=16;
  const X=i=>padL+i*(w-padL-padR)/(data.length-1);
  const Y=v=>h-padY-(v-mn)/(mx-mn)*(h-2*padY);
  const cy=gv("--cyan"), gold=gv("--gold");
  if(goal){
    const gy=Y(goal);
    c.setLineDash([5,4]); c.strokeStyle=gold; c.globalAlpha=.65; c.lineWidth=1.4;
    c.beginPath(); c.moveTo(padL,gy); c.lineTo(w-padR+6,gy); c.stroke();
    c.setLineDash([]); c.globalAlpha=1;
    c.fillStyle=gold; c.font="600 10px system-ui"; c.textAlign="left";
    c.fillText("цель "+goal, w-padR+9, gy+3.5);
  }
  const g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,cy+"55"); g.addColorStop(1,cy+"00");
  c.beginPath(); c.moveTo(X(0),Y(data[0])); data.forEach((v,i)=>c.lineTo(X(i),Y(v)));
  c.lineTo(X(data.length-1),h-padY); c.lineTo(X(0),h-padY); c.closePath(); c.fillStyle=g; c.fill();
  c.beginPath(); c.moveTo(X(0),Y(data[0])); data.forEach((v,i)=>c.lineTo(X(i),Y(v)));
  c.strokeStyle=cy; c.lineWidth=2.4; c.lineJoin="round"; c.shadowColor=cy; c.shadowBlur=9; c.stroke(); c.shadowBlur=0;
  if(log.length>1){ // стартовая точка есть смысл только при истории
    c.beginPath(); c.arc(X(0),Y(data[0]),3.2,0,7); c.fillStyle="#5f7288"; c.fill();
    c.fillStyle="#93a6bd"; c.font="600 10px system-ui"; c.textAlign="left";
    c.fillText(String(log[0].w), X(0)+3, Y(data[0])-8);
  }
  const li=data.length-1;
  c.beginPath(); c.arc(X(li),Y(data[li]),4,0,7); c.fillStyle=cy; c.shadowColor=cy; c.shadowBlur=8; c.fill(); c.shadowBlur=0;
  let ly=Y(data[li])+3.5;
  if(goal && Math.abs(Y(goal)-Y(data[li]))<13) ly=Y(goal)+(Y(data[li])>=Y(goal)?15:-11);
  c.fillStyle=cy; c.font="700 11px system-ui"; c.textAlign="left";
  c.fillText(String(log[log.length-1].w), w-padR+9, ly);
}
function pie(cv,parts){const {c,w,h}=setup(cv,150);const cx=w/2,cy=h/2,r=Math.min(w,h)/2-6;let a=-Math.PI/2;const tot=parts.reduce((s,p)=>s+p.v,0)||1;parts.forEach(p=>{const ang=p.v/tot*Math.PI*2;c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,r,a,a+ang);c.closePath();c.fillStyle=p.color;c.fill();a+=ang;});c.beginPath();c.arc(cx,cy,r*0.55,0,7);c.fillStyle=gv("--panel");c.fill();}

// аккуратная форма вместо системного prompt(); возвращает объект значений или null
function askModal(title, fields, opts){
  const o=opts||{};
  return new Promise(resolve=>{
    const ovl=el(`<div class="ovl"></div>`);
    const m=el(`<div class="modal"><h4>${title}</h4></div>`);
    const inputs={};
    fields.forEach(f=>{
      m.appendChild(el(`<span class="lab">${f.label}</span>`));
      let inp;
      if(f.type==="select"){
        inp=document.createElement("select");
        f.options.forEach(([v,t])=>{const o=document.createElement("option");o.value=v;o.textContent=t;inp.appendChild(o);});
        if(f.value!=null) inp.value=f.value;
      } else {
        inp=document.createElement("input");
        // числа вводим текстовым полем: type=number в браузере отбрасывает «82,4»
        // (запятая на русской клавиатуре) и отдаёт пустую строку — вес просто не сохранялся
        if(f.type==="number"){ inp.type="text"; inp.inputMode="decimal"; inp.autocomplete="off"; }
        else inp.type=f.type||"text";
        if(f.value!=null) inp.value=f.value;
        if(f.placeholder) inp.placeholder=f.placeholder;
      }
      m.appendChild(inp); inputs[f.name]=inp;
      if(f.note) m.appendChild(el(`<p class="nrm">${f.note}</p>`));   // пояснение под полем
    });
    const err=el(`<p class="ferr"></p>`); m.appendChild(err);
    const btns=el(`<div class="btns"><button class="no${o.del?" dl":""}"${o.del?' style="color:var(--danger);border-color:#5a2730"':""}>${o.del||"Отмена"}</button><button class="ok">Готово</button></div>`);
    m.appendChild(btns); ovl.appendChild(m); document.body.appendChild(ovl);
    setTimeout(()=>inputs[fields[0].name].focus(),50);
    const close=v=>{ovl.remove();resolve(v);};
    btns.querySelector(".no").onclick=()=>close(o.del?{__deleted:true}:null);
    btns.querySelector(".ok").onclick=()=>{
      const r={}; fields.forEach(f=>{const v=inputs[f.name].value;r[f.name]=typeof v==="string"?v.trim():v;});
      // ошибку показываем в самой форме — раньше форма закрывалась и всё приходилось вводить заново
      const bad=o.check?o.check(r):null;
      if(bad){ err.textContent=bad; err.classList.add("on"); return; }
      close(r);
    };
    ovl.onclick=e=>{if(e.target===ovl)close(null);};
    m.addEventListener("keydown",e=>{
      if(e.key==="Escape") close(null);
      if(e.key==="Enter"&&inputs[fields[0].name].tagName!=="SELECT")btns.querySelector(".ok").click();
    });
  });
}

function body_curW(){return S.body.log.length?S.body.log[S.body.log.length-1].w:0;}
// запись веса за сегодня: перезаписываем существующую и держим журнал отсортированным по дате
function logWeight(v){
  const w=Math.round(v*10)/10, ex=S.body.log.find(x=>x.date===TODAY);
  if(ex) ex.w=w; else S.body.log.push({date:TODAY,w});
  S.body.log.sort((p,q)=>p.date<q.date?-1:p.date>q.date?1:0);
}
// ---- нормы калорий и воды: считаются сами из веса, роста, возраста и тренировок ----
const ACTS=[["auto","🤖 Сам по отметкам тренировок"],["1.2","Сидячий образ жизни"],["1.375","Лёгкая активность"],
            ["1.55","Средняя активность"],["1.725","Высокая активность"],["1.9","Очень высокая"]];
const ACTNAME=f=>f<1.3?"сидячий":f<1.45?"лёгкая":f<1.65?"средняя":f<1.8?"высокая":"очень высокая";
// Тренировка — привычка, которую владелец так отметил (✏️ у привычки → «Это тренировка»),
// а если не отмечал — угадываем по названию. Считаем ДНИ с тренировкой: у кого-то это
// «Тренировка», у кого-то «Бег» и «Зал» одновременно
// «зал» и «йога» — только отдельным словом: раньше «День без залипания» (зал-ипания) и
// «йогурт» считались тренировкой и завышали норму калорий. Без lookbehind — его нет в старом Safari
const RE_SPORT=/трениров|спорт|фитнес|кроссфит|качалк|пробежк|бегать|плаван|бассейн|(?:^|[^а-яё])(?:бег|зал(?:а|е|у|ом)?|йог(?:а|и|е|у|ой))(?![а-яё])/i;
const isWorkout=h=>typeof h.sport==="boolean"?h.sport:RE_SPORT.test(h.name);
const workoutHabits=()=>S.habits.filter(isWorkout);
const workoutNames=()=>workoutHabits().map(h=>"«"+esc(withIco(h.ico,h.name))+"»").join(", ");
function workoutDays(n){ const hs=workoutHabits(); if(!hs.length) return 0;
  let c=0; for(let k=0;k<n;k++){ const ds=addDays(TODAY,-k); if(hs.some(h=>isDone(h.id,ds))) c++; } return c; }
function actFactor(){
  const a=S.body.act||"auto";
  if(a!=="auto") return num(a)||1.375;
  const pw=workoutDays(28)/4;   // тренировок в неделю по собственным отметкам
  return pw<0.5?1.2:pw<2.5?1.375:pw<4.5?1.55:pw<6.5?1.725:1.9;
}
const profileReady=()=>!!(body_curW() && S.body.height>0 && S.body.birth>0 && S.body.sex);
// Миффлин — Сан Жеор: сегодняшний стандарт расчёта основного обмена
function bmrValue(){
  if(!profileReady()) return 0;
  const age=Math.max(10,Math.min(100,+TODAY.slice(0,4)-S.body.birth));
  return 10*body_curW() + 6.25*S.body.height - 5*age + (S.body.sex==="f"?-161:5);
}
// Сколько срезать или добавить к поддержанию — зависит от того, ДАЛЕКО ли цель.
// Раньше было три режима (−15% / 0 / +10%), и цели 75 и 70 кг при весе 80 давали одно и то же
// число: Артём менял цель, а норма стояла (24.09.2026).
// Снижение: 10% при цели в 1–2 кг, дальше +1,5% за килограмм, но не больше 25% — обычный
// потолок безопасного дефицита. Набор: 5% + 1% за килограмм, не больше 15%.
const cutPct =kg=>Math.min(0.25,Math.max(0.10,0.08+0.015*kg));
const bulkPct=kg=>Math.min(0.15,Math.max(0.05,0.04+0.01*kg));
function norms(){
  const base=bmrValue(); if(!base) return null;
  const f=actFactor(), tdee=base*f, w=body_curW(), g=S.body.goalW;
  let cal=tdee, mode="поддержание веса", dir=0;
  if(g && w-g>0.5){ const p=cutPct(w-g); cal=tdee*(1-p); dir=-1; mode=`дефицит ${Math.round(p*100)}% — на снижение`; }
  else if(g && g-w>0.5){ const p=bulkPct(g-w); cal=tdee*(1+p); dir=1; mode=`профицит ${Math.round(p*100)}% — на набор`; }
  let floored=false;
  if(cal<base){ cal=base; floored=true; }   // ниже основного обмена не опускаемся
  // темп: 7 700 ккал ≈ 1 кг. Оценка, реальный вес скачет от воды и соли
  const perWk=Math.abs(cal-tdee)*7/7700, weeks=dir&&perWk>0.05?Math.ceil(Math.abs(w-g)/perWk):0;
  const trained=workoutDays(1)>0;           // тренировка сегодня — воды нужно больше
  return { bmr:Math.round(base/10)*10, tdee:Math.round(tdee/10)*10, cal:Math.round(cal/10)*10,
           water:Math.round(w*30/50)*50+(trained?500:0), trained,
           mode, floored, f, dir, perWk:Math.round(perWk*10)/10, weeks,
           perWeek:Math.round(workoutDays(28)/4*10)/10 };
}
// строка «откуда активность» — чтобы «по моим тренировкам» не было загадкой
function actLine(N){
  if(S.body.act!=="auto") return "активность: "+ACTNAME(N.f)+" (выбрана вручную)";
  if(!workoutHabits().length) return "активность: сидячий — нет привычки-тренировки. Нажми ✏️ у привычки и включи «Это тренировка»";
  const p=N.perWeek, word=Number.isInteger(p)?pl(p,"тренировка","тренировки","тренировок"):"тренировки";
  return `активность по отметкам ${workoutNames()}: ${String(p).replace(".",",")} ${word} в неделю (среднее за 4 недели) → ${ACTNAME(N.f)}`;
}
const calGoalNow =()=>S.body.calManual   ? S.body.calGoal   : (norms()?norms().cal   : 0);
const waterGoalNow=()=>S.body.waterManual? S.body.waterGoal : (norms()?norms().water : 0);

  if(!S.body.log.length){

      <div class="addbtn" id="addW"><span class="pl">+</span>Записать первый вес</div></div>`;

// окно одного дня из календаря «Все»: отметить любую привычку за этот день
function openDay(ds){
  const ovl=el(`<div class="ovl"><div class="modal"><h4></h4><p class="mtxt" style="margin-top:2px"></p>
    <div class="tchips" id="dayChips"></div><div class="btns"><button class="ok">Готово</button></div></div></div>`);
  const t=dayLabel(ds); ovl.querySelector("h4").textContent=t[0].toUpperCase()+t.slice(1);
  const sub=ovl.querySelector(".mtxt"), box=ovl.querySelector("#dayChips");
  const paint=popId=>{
    box.innerHTML=""; const arr=checksOf(ds);
    sub.textContent=`Отмечено ${arr.length} из ${S.habits.length} · каждая +${COIN} 🪙`;
    S.habits.forEach(h=>{
      const on=arr.includes(h.id);
      const c=el(`<div class="tchip${on?" on":""}" role="checkbox" tabindex="0" aria-checked="${on}"><span class="d">${on?"✓":""}</span><span class="nm"></span></div>`);
      c.querySelector(".nm").textContent=withIco(h.ico,h.name);
      const flip=()=>{
        const a=checksOf(ds).slice(), i=a.indexOf(h.id);
        if(i>=0) a.splice(i,1); else { a.push(h.id); if(h.since&&ds<h.since) h.since=ds; }
        if(a.length) S.checks[ds]=a; else delete S.checks[ds];
        save(); render(); paint(i<0?h.id:null);
      };
      c.onclick=flip;
      c.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); } };
      box.appendChild(c);
      if(popId===h.id) popEl(c);
    });
  };
  paint(null); document.body.appendChild(ovl);
  const close=()=>ovl.remove();
  ovl.querySelector(".ok").onclick=close;
  ovl.onclick=e=>{ if(e.target===ovl) close(); };
  ovl.addEventListener("keydown",e=>{ if(e.key==="Escape") close(); });
}

// ---- город-империя: одно здание за каждый уровень + стройка следующего ----
// Одна рисовалка и для карточки на Обзоре, и для картинки в сторис (s — масштаб линий)
const hash01=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
function skyline(c,x0,y0,w,h,L,frac,s){
  const emer=gv("--emerald"),gold=gv("--gold"),cyan=gv("--cyan");
  const n=L+1, slot=w/Math.max(n,9), off=x0+(w-n*slot)/2, gy=y0+h;
  const rankAt=new Set(RANKS.map(x=>x[2]));          // здание, на котором сменилось звание, — в золоте
  c.save();
  c.strokeStyle=cyan;c.globalAlpha=.5;c.lineWidth=1.4*s;c.shadowColor=cyan;c.shadowBlur=7*s;
  c.beginPath();c.moveTo(x0,gy+.5);c.lineTo(x0+w,gy+.5);c.stroke();c.shadowBlur=0;c.globalAlpha=1;
  for(let i=0;i<n;i++){
    const lv=i+1, built=lv<=L, curB=lv===L;
    const bw=slot*0.72, bx=off+i*slot+(slot-bw)/2;
    const bh=h*(0.26+0.5*Math.min(1,i/24)+0.22*hash01(lv)), by=gy-bh;   // город растёт ввысь
    if(built){
      const edge=rankAt.has(lv)?gold:emer;
      c.fillStyle=curB?"#2fe38f33":"#2fe38f1f"; c.strokeStyle=edge; c.lineWidth=(curB?2:1.2)*s;
      c.shadowColor=edge; c.shadowBlur=(curB?14:6)*s;
      c.beginPath();c.rect(bx,by,bw,bh);c.fill();c.stroke();c.shadowBlur=0;
      if(bw>=7*s){ c.fillStyle=gold; c.globalAlpha=curB?.9:.5; const st=6*s, ws=2.2*s;
        for(let ry=by+4*s;ry<gy-3*s;ry+=st) for(let rx=bx+3*s;rx<bx+bw-2.5*s;rx+=st) c.fillRect(rx,ry,ws,ws);
        c.globalAlpha=1; }
    }else{   // стройка: пунктир и заливка снизу на сколько пройден уровень
      c.fillStyle="#2fe38f26"; c.fillRect(bx,gy-bh*Math.max(0,Math.min(1,frac)),bw,bh*Math.max(0,Math.min(1,frac)));
      c.setLineDash([3*s,3*s]); c.strokeStyle="#68809b"; c.lineWidth=1.1*s;
      c.beginPath();c.rect(bx,by,bw,bh);c.stroke(); c.setLineDash([]);
    }
  }
  c.restore();
}

function rr(c,x,yy,w,h,r){c.beginPath();c.moveTo(x+r,yy);c.arcTo(x+w,yy,x+w,yy+h,r);c.arcTo(x+w,yy+h,x,yy+h,r);c.arcTo(x,yy+h,x,yy,r);c.arcTo(x,yy,x+w,yy,r);c.closePath();}

function draw(){
  invalidate();
  const xp=totalXP(),L=levelOf(xp);
  // празднуем новый уровень. Запоминаем самый высокий: снял галочку и поставил снова —
  // второго праздника за тот же уровень не будет
  if(S.lastLv==null){
    S.lastLv=L; save();

    if(!FIRST_RUN && L>1) celebrateLevel(L,1,true);
  }
  else if(L>S.lastLv){ const p=S.lastLv; S.lastLv=L; save(); celebrateLevel(L,p); }

  document.getElementById("lvlChip").innerHTML=`Ур. ${L}<span class="rk"> · ${rankName(rankOf(L))}</span>`;

// Окно «с чего начнём»: отдаёт список [ico,name] или null, если передумал.
// Пока не нажато «Начать», ничего не стирается — отмена сброса ничего не теряет.
function pickHabits(){
  return new Promise(resolve=>{
    const items=HABITPICK.map(([ico,name,on])=>({ico,name,on:!!on}));
    const ovl=el(`<div class="ovl" style="z-index:72"><div class="modal">
      <h4>Выбери привычки</h4>
      <p class="mtxt" style="margin-top:4px">Советую начать с трёх: день идёт в серию 🔥 от трёх отметок. Добавить или убрать можно потом, в «✅ Привычки».</p>
      <div class="hpick" id="hpList"></div>
      <span class="lab">Своя привычка</span>
      <div class="hpown"><input id="hpOwn" type="text" maxlength="60" placeholder="🏃 Бег по утрам" autocomplete="off"><button class="hpadd" id="hpAdd" aria-label="Добавить свою">+</button></div>
      <p class="nrm" id="hpHint"></p>
      <div class="btns"><button class="no" id="hpNo">Назад</button><button class="ok" id="hpGo"></button></div></div></div>`);
    const list=ovl.querySelector("#hpList"), own=ovl.querySelector("#hpOwn"),
          go=ovl.querySelector("#hpGo"), hint=ovl.querySelector("#hpHint");
    const draw=()=>{
      list.innerHTML="";
      items.forEach(it=>{
        const c=el(`<div class="tchip${it.on?" on":""}" role="checkbox" tabindex="0" aria-checked="${it.on}"><span class="d">${it.on?"✓":""}</span><span class="nm"></span></div>`);
        c.querySelector(".nm").textContent=withIco(it.ico,it.name);
        const flip=()=>{ it.on=!it.on; draw(); };
        c.onclick=flip;
        c.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); } };
        list.appendChild(c);
      });
      count();
    };
    // набранная, но не добавленная своя привычка тоже считается: «Начать» её не потеряет
    const count=()=>{
      const typed=parseIco(own.value).name.toLowerCase();
      const n=items.filter(it=>it.on).length+(typed&&!items.some(it=>it.on&&it.name.toLowerCase()===typed)?1:0);
      go.disabled=!n;
      go.textContent=`🚀 Начать (${n})`;   // надпись короткая всегда: на 320 px длинная ломалась в две строки
      hint.textContent=!n?"Отметь хотя бы одну привычку.":n>3?"Больше трёх можно, но серию держать тяжелее.":"";
    };
    // своя привычка встаёт в список уже отмеченной; такая же уже есть — просто отмечаем её
    const addOwn=()=>{
      const {ico,name}=parseIco(own.value); own.value="";
      if(!name) return;
      const same=items.find(it=>it.name.toLowerCase()===name.toLowerCase());
      if(same) same.on=true; else items.push({ico,name,on:true});
      draw();
    };
    ovl.querySelector("#hpAdd").onclick=addOwn;
    own.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); addOwn(); } });
    own.addEventListener("input",count);
    const close=v=>{ ovl.remove(); resolve(v); };
    ovl.querySelector("#hpNo").onclick=()=>close(null);
    ovl.onclick=e=>{ if(e.target===ovl) close(null); };
    ovl.addEventListener("keydown",e=>{ if(e.key==="Escape") close(null); });
    // набрал своё и сразу нажал «Начать» — набранное не теряем
    go.onclick=()=>{ if(own.value.trim()) addOwn(); const r=items.filter(it=>it.on).map(it=>[it.ico,it.name]); if(r.length) close(r); };
    draw(); document.body.appendChild(ovl);
  });
}

}
